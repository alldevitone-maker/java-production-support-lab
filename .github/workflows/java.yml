name: Java smoke checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: mkdir -p out && javac -d out src/main/java/lab/payments/*.java
      - name: Exercise API and console
        run: sh scripts/smoke-test.sh
      - name: Verify all incident scenarios
        run: python3 scripts/scenario-test.py
