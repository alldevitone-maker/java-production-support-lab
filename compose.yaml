services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payops
      POSTGRES_USER: payops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - payops-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U payops -d payops]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/payops
      DATABASE_USERNAME: payops
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  payops-data:
